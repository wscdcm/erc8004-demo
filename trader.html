<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易机器人仪表盘</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0a0e17; color:#e1e5eb; min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1f2e,#0d1117); padding:20px 30px; border-bottom:1px solid #21262d; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:22px; font-weight:600; }
.header h1 span { color:#58a6ff; }
.status-badge { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; }
.status-live { background:#0d3320; color:#3fb950; border:1px solid #238636; }
.status-off { background:#3d1f1f; color:#f85149; border:1px solid #da3633; }
.container { max-width:1200px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.card { background:#161b22; border:1px solid #21262d; border-radius:10px; padding:20px; }
.card h2 { font-size:15px; color:#8b949e; margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }
.card-full { grid-column:1/-1; }
.metric { margin-bottom:16px; }
.metric-label { font-size:12px; color:#8b949e; }
.metric-value { font-size:28px; font-weight:700; }
.metric-value.positive { color:#3fb950; }
.metric-value.negative { color:#f85149; }
.metric-value.neutral { color:#58a6ff; }
.indicators { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ind-item { background:#0d1117; border-radius:8px; padding:12px; }
.ind-item .label { font-size:11px; color:#8b949e; }
.ind-item .val { font-size:18px; font-weight:600; }
.position-box { background:#0d1117; border-radius:8px; padding:16px; margin-top:8px; }
.position-box .side { font-size:20px; font-weight:700; }
.side-long { color:#3fb950; }
.side-short { color:#f85149; }
.no-position { color:#484f58; font-style:italic; padding:20px; text-align:center; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:#8b949e; padding:8px 6px; border-bottom:1px solid #21262d; font-weight:500; }
td { padding:8px 6px; border-bottom:1px solid #0d1117; }
.pnl-pos { color:#3fb950; }
.pnl-neg { color:#f85149; }
.empty-trades { text-align:center; color:#484f58; padding:30px; }
.refresh-info { font-size:11px; color:#484f58; }
.loading { display:flex; justify-content:center; align-items:center; padding:40px; }
.spinner { border:3px solid #21262d; border-top-color:#58a6ff; border-radius:50%; width:30px; height:30px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <h1>📊 <span>交易机器人</span> 仪表盘</h1>
  <div id="statusBadge" class="status-badge status-off">离线</div>
</div>
<div class="container">
  <div class="card">
    <h2>💰 账户余额</h2>
    <div class="metric">
      <div class="metric-label">当前余额</div>
      <div class="metric-value neutral" id="equity">--</div>
    </div>
    <div class="metric">
      <div class="metric-label">总盈亏</div>
      <div class="metric-value" id="pnl">--</div>
    </div>
  </div>
  <div class="card">
    <h2>📈 当前持仓</h2>
    <div id="positionArea"><div class="no-position">无持仓</div></div>
  </div>
  <div class="card">
    <h2>📊 技术指标</h2>
    <div class="indicators" id="indicatorArea">
      <div class="ind-item"><div class="label">EMA快线</div><div class="val" id="emaFast">--</div></div>
      <div class="ind-item"><div class="label">EMA慢线</div><div class="val" id="emaSlow">--</div></div>
      <div class="ind-item"><div class="label">ADX</div><div class="val" id="adx">--</div></div>
      <div class="ind-item"><div class="label">ATR</div><div class="val" id="atr">--</div></div>
      <div class="ind-item"><div class="label">趋势</div><div class="val" id="trend">--</div></div>
      <div class="ind-item"><div class="label">冷却</div><div class="val" id="cooldown">--</div></div>
    </div>
  </div>
  <div class="card">
    <h2>📋 统计</h2>
    <div class="metric">
      <div class="metric-label">交易次数</div>
      <div class="metric-value neutral" id="totalTrades">0</div>
    </div>
    <div class="metric">
      <div class="metric-label">胜率</div>
      <div class="metric-value" id="winRate">--</div>
    </div>
  </div>
  <div class="card card-full">
    <h2>📜 交易记录</h2>
    <div id="tradeHistory"><div class="empty-trades">无交易记录 — 等待信号</div></div>
  </div>
</div>
<div style="text-align:center;padding:10px;">
  <span class="refresh-info">每10秒自动刷新 · 最后更新: <span id="lastUpdate">--</span></span>
</div>

<script>
const API = '/api/trader';
const INITIAL = 5000;

async function fetchState() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    document.getElementById('statusBadge').className = 'status-badge status-live';
    document.getElementById('statusBadge').textContent = '在线';
    render(s);
  } catch(e) {
    document.getElementById('statusBadge').className = 'status-badge status-off';
    document.getElementById('statusBadge').textContent = 'OFFLINE';
  }
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
}

function render(s) {
  // Equity
  const eq = s.equity || INITIAL;
  document.getElementById('equity').textContent = '$' + eq.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pnl = eq - INITIAL;
  const pnlEl = document.getElementById('pnl');
  pnlEl.textContent = (pnl>=0?'+':'') + '$' + pnl.toFixed(2);
  pnlEl.className = 'metric-value ' + (pnl>0?'positive':pnl<0?'negative':'neutral');

  // Position
  const pos = s.position;
  const posArea = document.getElementById('positionArea');
  if (pos) {
    const sideClass = pos.side==='LONG'?'side-long':'side-short';
    const upnl = pos.unrealizedPnl || 0;
    const entry = pos.entry || pos.entryPrice || 0;
    const qty = pos.qty || pos.quantity || pos.size || '--';
    const tp1 = pos.tp1 || '--';
    posArea.innerHTML = `<div class="position-box">
      <div class="side ${sideClass}">${pos.side} [${pos.mode || ''}]</div>
      <div style="margin-top:8px;font-size:14px;">
        <div>Entry: <b>$${Number(entry).toLocaleString()}</b></div>
        <div>Size: <b>${qty}</b></div>
        <div>Stop Loss: <b>$${Number(pos.stopLoss).toLocaleString()}</b></div>
        ${tp1 !== '--' ? `<div>TP1: <b>$${Number(tp1).toLocaleString()}</b></div>` : ''}
        <div>Trailing: <b>${pos.trailingArmed ? '$'+Number(pos.trailingStop).toLocaleString() : 'Not armed'}</b></div>
      </div>
    </div>`;
  } else {
    posArea.innerHTML = '<div class="no-position">无持仓 — 等待EMA交叉</div>';
  }

  // Indicators
  const ind = s.indicators || {};
  document.getElementById('emaFast').textContent = ind.emaFast ? Number(ind.emaFast).toFixed(0) : '--';
  document.getElementById('emaSlow').textContent = ind.emaSlow ? Number(ind.emaSlow).toFixed(0) : '--';
  document.getElementById('adx').textContent = ind.adx ? Number(ind.adx).toFixed(1) : '--';
  document.getElementById('atr').textContent = ind.atr ? Number(ind.atr).toFixed(1) : '--';
  const trendVal = s.trend === 'up' ? '↑ 上涨' : s.trend === 'down' ? '↓ 下跌' : '— 横盘';
  document.getElementById('trend').textContent = trendVal;
  document.getElementById('trend').style.color = s.trend === 'up' ? '#3fb950' : s.trend === 'down' ? '#f85149' : '#8b949e';
  const cd = s.cooldownEnd || 0;
  const cdRemain = cd > Date.now() ? Math.ceil((cd - Date.now())/60000) + 'm' : 'None';
  document.getElementById('cooldown').textContent = cdRemain;

  // Stats
  const trades = s.trades || [];
  document.getElementById('totalTrades').textContent = trades.length;
  if (trades.length > 0) {
    const wins = trades.filter(t=>(t.pnl||0)>0).length;
    const wr = (wins/trades.length*100).toFixed(1);
    const wrEl = document.getElementById('winRate');
    wrEl.textContent = wr + '%';
    wrEl.className = 'metric-value ' + (wr>=50?'positive':'negative');
  }

  // Trade History
  const thEl = document.getElementById('tradeHistory');
  if (trades.length === 0) {
    thEl.innerHTML = '<div class="empty-trades">无交易记录 — 等待信号</div>';
  } else {
    let html = '<table><tr><th>#</th><th>Side</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Time</th></tr>';
    trades.slice().reverse().forEach((t,i) => {
      const cls = (t.pnl||0)>=0?'pnl-pos':'pnl-neg';
      html += `<tr><td>${trades.length-i}</td><td>${t.side||'--'}</td><td>$${Number(t.entry||0).toLocaleString()}</td><td>$${Number(t.exit||0).toLocaleString()}</td><td class="${cls}">${(t.pnl||0)>=0?'+':''}$${(t.pnl||0).toFixed(2)}</td><td>${t.closedAt ? new Date(t.closedAt).toLocaleString() : '--'}</td></tr>`;
    });
    html += '</table>';
    thEl.innerHTML = html;
  }
}

fetchState();
setInterval(fetchState, 10000);
</script>
</body>
</html>
